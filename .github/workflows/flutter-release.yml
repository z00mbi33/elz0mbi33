name: Flutter Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        default: v1.1.0
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_macos:
    name: Build macOS ZIP
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../elz0mbi33-macos.zip elz0mbi33.app

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_tag || github.ref_name }}
          body: |
            ## elz0mbi33 v1.1.0

            A lightweight floating Spotify lyrics app for macOS and Windows.

            ### Highlights

            - Always-on-top floating lyrics window
            - Visible across macOS Spaces and full-screen apps
            - Spotify PKCE authentication
            - Windows auth recovery after sleep and stale token refresh
            - Synchronized lyrics from LRCLIB
            - Responsive compact layout
            - Clear fallback when lyrics are unavailable
            - macOS dependency cleanup and Swift Package Manager support

            ### Download

            - `elz0mbi33-macos.zip` — macOS
            - `elz0mbi33-windows.zip` — Windows

            ### Setup

            1. Create a Spotify developer application.
            2. Add this redirect URI:

               `http://127.0.0.1:8888/callback`

            3. Launch elz0mbi33 and select **Connect Spotify**.
            4. Enter your Spotify Client ID and complete authorization in the browser.

            ### Notes

            - Spotify Premium may be required for playback-state access.
            - Lyrics depend on LRCLIB availability.
            - If lyrics are unavailable, the app displays a fallback status and retries later.
          artifacts: build/macos/elz0mbi33-macos.zip
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    name: Build Windows ZIP
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package ZIP
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build\windows\runner\Release"
          }
          $zipPath = "build\windows\elz0mbi33-windows.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zipPath

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_tag || github.ref_name }}
          body: |
            ## elz0mbi33 v1.1.0

            A lightweight floating Spotify lyrics app for macOS and Windows.

            ### Highlights

            - Always-on-top floating lyrics window
            - Visible across macOS Spaces and full-screen apps
            - Spotify PKCE authentication
            - Windows auth recovery after sleep and stale token refresh
            - Synchronized lyrics from LRCLIB
            - Responsive compact layout
            - Clear fallback when lyrics are unavailable
            - macOS dependency cleanup and Swift Package Manager support

            ### Download

            - `elz0mbi33-macos.zip` — macOS
            - `elz0mbi33-windows.zip` — Windows

            ### Setup

            1. Create a Spotify developer application.
            2. Add this redirect URI:

               `http://127.0.0.1:8888/callback`

            3. Launch elz0mbi33 and select **Connect Spotify**.
            4. Enter your Spotify Client ID and complete authorization in the browser.

            ### Notes

            - Spotify Premium may be required for playback-state access.
            - Lyrics depend on LRCLIB availability.
            - If lyrics are unavailable, the app displays a fallback status and retries later.
          artifacts: build/windows/elz0mbi33-windows.zip
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
