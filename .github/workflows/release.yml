name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binary
        run: |
          swift build -c release --arch arm64 --build-path .build/release-arm64
          swift build -c release --arch x86_64 --build-path .build/release-x86_64

      - name: Package app
        run: |
          rm -rf dist
          mkdir -p dist/elz0mbi33.app/Contents/MacOS
          mkdir -p dist/elz0mbi33.app/Contents/Resources
          cp $(swift build -c release --arch arm64 --build-path .build/release-arm64 --show-bin-path)/elz0mbi33 dist/elz0mbi33.app/Contents/MacOS/elz0mbi33-arm64
          cp $(swift build -c release --arch x86_64 --build-path .build/release-x86_64 --show-bin-path)/elz0mbi33 dist/elz0mbi33.app/Contents/MacOS/elz0mbi33-x86_64
          lipo -create dist/elz0mbi33.app/Contents/MacOS/elz0mbi33-arm64 dist/elz0mbi33.app/Contents/MacOS/elz0mbi33-x86_64 -output dist/elz0mbi33.app/Contents/MacOS/elz0mbi33
          rm dist/elz0mbi33.app/Contents/MacOS/elz0mbi33-arm64 dist/elz0mbi33.app/Contents/MacOS/elz0mbi33-x86_64
          cp Resources/Info.plist dist/elz0mbi33.app/Contents/Info.plist
          chmod +x dist/elz0mbi33.app/Contents/MacOS/elz0mbi33

      - name: Create zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent elz0mbi33.app elz0mbi33-macos.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/elz0mbi33-macos.zip
